<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/saving.png">
  <title>Budget Tracker — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Merriweather:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>
  <header class="site-header">
    <nav class="main-nav">
      <div class="nav-container">
        <h1 class="site-logo text-white">Budget Tracker</h1>
        <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation menu">
        <label for="menu-toggle" class="menu-icon">&#9776;</label>
        <ul class="nav" aria-label="Main navigation">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="forms.html">Add Transaction</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="tips.html">Tips</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="wage.html">Wage Estimator</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row g-4">
        <div class="col-md-3">
          <div class="p-4 border">
            <h2>Income</h2>
            <h3 class="display-6">$<span id="dashboard-income">0.00</span></h3>
            <p id="income-breakdown"></p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="p-4 border">
            <h2>Expenditures</h2>
            <h3 class="display-6">$<span id="dashboard-expenses">0.00</span></h3>
            <p id="expense-breakdown"></p>
          </div>
        </div>
        <div class="col-md-6">
          <div class="p-4 border">
            <h2>Spending Overview</h2>
            <canvas id="dashboard-chart" class="img-fluid my-3"></canvas>
          </div>
        <div class="text-center">
          <h2>Remaining Balance</h2>
          <h3 class="display-6">$<span id="remaining-balance">0.00</span></h3>
        </div>
      </div>
    </div>

    <!-- Transaction List -->
    <div class="row g-4 mt-4">
      <div class="col-md-12">
        <div class="p-4 border">
          <h2>Recent Transactions</h2>
          <table id="transaction-list" class="table table-sm">
            <thead>
              <tr>
                <th>Description</th>
                <th>Amount</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="3">No transactions yet. Add one to get started.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-3 bg-success text-white">
    <p><a class="text-white text-decoration-underline" href="tips.html">See budgeting tips</a></p>
  </footer>

  <!-- Edit Transaction Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">Edit Transaction</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="edit-form">
            <input type="hidden" id="edit-id" name="edit-id">
            <div class="mb-3">
              <label for="edit-type" class="form-label">Type</label>
              <select id="edit-type" name="edit-type" class="form-select">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="edit-amount" class="form-label">Amount</label>
              <input type="number" id="edit-amount" name="edit-amount" class="form-control" step="0.01">
            </div>
            <div class="mb-3">
              <label for="edit-category" class="form-label">Category</label>
              <input type="text" id="edit-category" name="edit-category" class="form-control">
            </div>
            <div class="mb-3">
              <label for="edit-date" class="form-label">Date</label>
              <input type="date" id="edit-date" name="edit-date" class="form-control">
            </div>
            <div class="mb-3">
              <label for="edit-note" class="form-label">Note</label>
              <input type="text" id="edit-note" name="edit-note" class="form-control">
            </div>
            <div class="form-check mb-3">
              <input type="checkbox" id="edit-essential" name="edit-essential" class="form-check-input">
              <label for="edit-essential" class="form-check-label">Essential</label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="save-edit-btn">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
  <script src="scripts/Function.js"></script>
  <script>
    function updateDashboard() {
      // Render transaction list
      if (typeof renderTransactionList === 'function') {
        renderTransactionList();
      }

      // Update income
      const incomeTransactions = readStorage().filter(item => String(item.type || '').toLowerCase() === 'income');
      const totalIncome = incomeTransactions.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const incomeEl = T("#dashboard-income");
      if (incomeEl) incomeEl.textContent = totalIncome.toFixed(2);

      // Update expenses
      const expenseTransactions = readStorage().filter(item => String(item.type || '').toLowerCase() === 'expense');
      const totalExpense = expenseTransactions.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const expenseEl = T("#dashboard-expenses");
      if (expenseEl) expenseEl.textContent = totalExpense.toFixed(2);

      // Update remaining balance
      const remainingEl = T("#remaining-balance");
      if (remainingEl) remainingEl.textContent = (totalIncome - totalExpense).toFixed(2);

      // Update expense breakdown by category
      const expenseBreakdown = {};
      for (const tx of expenseTransactions) {
        expenseBreakdown[tx.category] = (expenseBreakdown[tx.category] || 0) + Number(tx.amount || 0);
      }
      const expenseBreakdownEl = T("#expense-breakdown");
      if (expenseBreakdownEl) {
        const breakdownText = Object.entries(expenseBreakdown)
          .map(([cat, amt]) => `${cat}: $${amt.toFixed(2)}`)
          .join('<br>');
        expenseBreakdownEl.innerHTML = breakdownText || 'No expenses yet';
      }

      // Update chart
      const chartLabels = Object.keys(expenseBreakdown);
      const chartData = chartLabels.map(label => expenseBreakdown[label]);
      const canvas = T("#dashboard-chart");
      if (canvas) {
        const ctx = canvas.getContext("2d");
        if (window._dashboardChart) {
          window._dashboardChart.data.labels = chartLabels;
          window._dashboardChart.data.datasets[0].data = chartData;
          window._dashboardChart.update();
        } else {
          window._dashboardChart = new Chart(ctx, {
            type: "pie",
            data: {
              labels: chartLabels,
              datasets: [{
                label: "Expenses by Category",
                data: chartData,
              }]
            },
            options: {
              responsive: true,
              plugins: {
                legend: { position: 'top'}
              }
            }
          });
        }
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      updateDashboard();
      const saveBtn = document.getElementById('save-edit-btn');
      if (saveBtn) {
        saveBtn.addEventListener('click', onSaveEdit);
      }
      window.addEventListener('storage', function (e) {
        if (e.key === 'SS_Transaction') updateDashboard();
      });
      if ('BroadcastChannel' in window) {
        const bc = new BroadcastChannel('transactions');
        bc.addEventListener('message', function (ev) {
          if (ev && ev.data && ev.data.type === 'updated') updateDashboard();
        });
      }
    });
  </script>
</body>
</html>
